<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1"/>
    </pattern>
    <!-- Glow Effects -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="1000" height="800" fill="#070a13" />
  <rect width="1000" height="800" fill="url(#grid)" />

  <!-- Israel Territory (West Border Region) -->
  <path d="M 50,200 L 120,200 L 150,280 L 130,450 L 110,600 L 50,600 Z" 
        fill="rgba(0, 240, 255, 0.03)" 
        stroke="rgba(0, 240, 255, 0.3)" 
        stroke-width="2" 
        filter="url(#glow-cyan)" />

  <!-- Operational Middle East Sectors (Lebanon, Syria, Iraq, UAE) -->
  <path d="M 120,200 L 350,100 L 600,100 L 950,300 L 950,750 L 500,750 L 130,450 L 150,280 Z" 
        fill="rgba(255, 59, 48, 0.02)" 
        stroke="rgba(255, 59, 48, 0.2)" 
        stroke-width="2" 
        filter="url(#glow-red)" />

  <!-- Borders / Demarcation lines -->
  <path d="M 120,200 L 150,280 L 130,450" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2" 
        stroke-dasharray="5,5" 
        opacity="0.4" />

  <!-- Country Text Labels -->
  <text x="60" y="320" fill="#00f0ff" font-family="monospace" font-size="20" font-weight="bold" letter-spacing="2" opacity="0.6">ISRAEL</text>
  <text x="350" y="240" fill="#ff3b30" font-family="monospace" font-size="20" font-weight="bold" letter-spacing="3" opacity="0.5">SYRIA</text>
  <text x="220" y="160" fill="#ff3b30" font-family="monospace" font-size="18" font-weight="bold" letter-spacing="2" opacity="0.5">LEBANON</text>
  <text x="580" y="350" fill="#ff3b30" font-family="monospace" font-size="20" font-weight="bold" letter-spacing="3" opacity="0.5">IRAQ</text>
  <text x="750" y="650" fill="#ff3b30" font-family="monospace" font-size="20" font-weight="bold" letter-spacing="3" opacity="0.5">UAE</text>

  <!-- Compass / HUD elements -->
  <g transform="translate(80, 720)" opacity="0.3">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00f0ff" stroke-width="1" />
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#00f0ff" />
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#00f0ff" />
    <text x="-5" y="-55" fill="#00f0ff" font-family="sans-serif" font-size="10">N</text>
  </g>
</svg>
