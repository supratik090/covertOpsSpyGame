<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1"/>
    </pattern>
    <!-- Glow Effects -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="1000" height="800" fill="#070a13" />
  <rect width="1000" height="800" fill="url(#grid)" />

  <!-- Pakistan Region Outline (West) -->
  <path d="M 50,680 L 280,700 L 350,680 L 380,580 L 600,350 L 650,280 L 665,200 L 660,120 L 650,80 L 540,40 L 400,50 L 200,80 L 80,200 L 50,400 Z" 
        fill="rgba(255, 59, 48, 0.03)" 
        stroke="rgba(255, 59, 48, 0.3)" 
        stroke-width="2" 
        filter="url(#glow-red)" />

  <!-- India Region Outline (East) -->
  <path d="M 380,580 L 600,350 L 650,280 L 665,200 L 660,120 L 680,80 L 750,50 L 900,50 L 950,100 L 950,750 L 700,750 L 500,700 Z" 
        fill="rgba(0, 240, 255, 0.03)" 
        stroke="rgba(0, 240, 255, 0.3)" 
        stroke-width="2" 
        filter="url(#glow-cyan)" />

  <!-- International Border / Line of Control (Subtle dashed line) -->
  <path d="M 350,700 L 380,580 L 600,350 L 650,280 L 665,200 L 660,120" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-dasharray="8,8" 
        opacity="0.5" />

  <!-- Country Text Labels -->
  <text x="250" y="300" fill="#ff3b30" font-family="monospace" font-size="24" font-weight="bold" letter-spacing="4" opacity="0.6">PAKISTAN</text>
  <text x="700" y="400" fill="#00f0ff" font-family="monospace" font-size="24" font-weight="bold" letter-spacing="4" opacity="0.6">INDIA</text>

  <!-- Compass / HUD elements -->
  <g transform="translate(80, 720)" opacity="0.3">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00f0ff" stroke-width="1" />
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#00f0ff" />
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#00f0ff" />
    <text x="-5" y="-55" fill="#00f0ff" font-family="sans-serif" font-size="10">N</text>
  </g>
</svg>
