<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1"/>
    </pattern>
    <!-- Glow Effects -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="1000" height="800" fill="#070a13" />
  <rect width="1000" height="800" fill="url(#grid)" />

  <!-- India Region Outline (West & North-East) -->
  <path d="M 50,50 L 50,750 L 580,750 L 580,680 L 610,600 L 590,500 L 650,420 L 700,420 L 720,250 L 800,200 L 950,200 L 950,50 Z" 
        fill="rgba(0, 240, 255, 0.02)" 
        stroke="rgba(0, 240, 255, 0.25)" 
        stroke-width="2" 
        filter="url(#glow-cyan)" />

  <!-- Bangladesh Region Outline (Center-East Faction) -->
  <path d="M 580,680 L 610,600 L 590,500 L 650,420 L 700,420 L 720,250 L 820,250 L 850,350 L 890,550 L 820,700 L 700,720 Z" 
        fill="rgba(255, 59, 48, 0.03)" 
        stroke="rgba(255, 59, 48, 0.3)" 
        stroke-width="2" 
        filter="url(#glow-red)" />

  <!-- International Border (Dashed line) -->
  <path d="M 580,680 L 610,600 L 590,500 L 650,420 L 700,420 L 720,250" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        stroke-dasharray="6,6" 
        opacity="0.5" />

  <!-- Country Text Labels -->
  <text x="700" y="480" fill="#ff3b30" font-family="monospace" font-size="22" font-weight="bold" letter-spacing="4" opacity="0.6">BANGLADESH</text>
  <text x="300" y="380" fill="#00f0ff" font-family="monospace" font-size="24" font-weight="bold" letter-spacing="4" opacity="0.6">INDIA</text>

  <!-- Compass / HUD elements -->
  <g transform="translate(80, 720)" opacity="0.3">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00f0ff" stroke-width="1" />
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#00f0ff" />
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#00f0ff" />
    <text x="-5" y="-55" fill="#00f0ff" font-family="sans-serif" font-size="10">N</text>
  </g>
</svg>
