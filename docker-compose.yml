services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "7900:7900"
    environment:
      MONGO_URI: mongodb://mongodb:27017/covert_ops
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
